[workspace]
members = [
    "crates/cadmark-core",
    "crates/cadmark-kernel",
    "crates/cadmark-renderer",
    "crates/cadmark-ui",
    "crates/cadmark-bridge",
    "crates/cadmark-app",
]
resolver = "2"

[workspace.package]
version = "0.202604.600"

[workspace.dependencies]
# Internal crates
cadmark-core = { path = "crates/cadmark-core" }
cadmark-kernel = { path = "crates/cadmark-kernel" }
cadmark-renderer = { path = "crates/cadmark-renderer" }
cadmark-ui = { path = "crates/cadmark-ui" }
cadmark-bridge = { path = "crates/cadmark-bridge" }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }

# Python embedding
pyo3 = { version = "0.24", features = ["auto-initialize"] }

# Script sandbox (Linux)
landlock = "0.4.7"
libc = "0.2.183"
tempfile = "3"

# GPU rendering
wgpu = { version = "24", features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# UI
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
