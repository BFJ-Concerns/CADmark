# Cargo settings shared by every checkout.

[env]
# The Python interpreter PyO3 builds against and the kernel embeds: the
# project's virtual environment, created by `scripts/bootstrap-python-runtime`.
# `relative = true` resolves the path against the repository root on
# whichever machine builds, so nothing here names a home directory. The
# venv's `bin/python` is a symlink to the real Python 3.12 install; the
# build scripts follow it to find the interpreter home and library.
#
# To build against another interpreter, set PYO3_PYTHON in the environment;
# a process environment variable overrides this value.
PYO3_PYTHON = { value = ".venv/bin/python", relative = true }
