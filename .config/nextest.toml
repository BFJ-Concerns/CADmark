# nextest configuration. The ci profile is what .github/workflows/ci.yml
# runs: retries make flaky tests visible (fail → pass on retry is reported
# as FLAKY) instead of failing the run on bad luck. Genuinely broken tests
# still fail after all retries.

[profile.ci]
retries = 2
fail-fast = false
# A test that hangs — the renderer's GPU tests have stalled before — is
# reported as its own failure instead of consuming the job's whole time
# budget. The kernel's script-executing tests take seconds, not minutes.
slow-timeout = { period = "120s", terminate-after = 3 }
